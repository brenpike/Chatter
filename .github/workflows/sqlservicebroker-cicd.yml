name: Chatter.MessageBrokers.SqlServiceBroker CI/CD

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'The reason for running the workflow'
        required: true
        default: 'Manual build from GitHub UI'
  push:
    branches:
      - 'feature/**'
      - 'bugfix/**'
      - 'hotfix/**'
      - 'refactor/**'
      - 'chore/**'
      - 'docs/**'
      - 'test/**'
      - 'ci/**'
      - 'release/**'
      - master
    paths:
      - 'src/Chatter.MessageBrokers.SqlServiceBroker/**'
      - 'tests/**'
      - '.github/workflows/sqlservicebroker-cicd.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'src/Chatter.MessageBrokers.SqlServiceBroker/**'
      - 'tests/**'
      - '.github/workflows/sqlservicebroker-cicd.yml'

permissions:
  contents: read

concurrency:
  group: release-sqlservicebroker
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
      - name: Restore
        run: dotnet restore 'src/Chatter.MessageBrokers.SqlServiceBroker/tests/Chatter.MessageBrokers.SqlServiceBroker.Tests.csproj' --locked-mode
      - name: Build
        run: dotnet build 'src/Chatter.MessageBrokers.SqlServiceBroker/tests/Chatter.MessageBrokers.SqlServiceBroker.Tests.csproj' -c Release --no-restore
      - name: Test
        run: dotnet test 'src/Chatter.MessageBrokers.SqlServiceBroker/tests/Chatter.MessageBrokers.SqlServiceBroker.Tests.csproj' -c Release --no-build /p:CollectCoverage=true
      - name: Pack
        run: dotnet pack 'src/Chatter.MessageBrokers.SqlServiceBroker/src/Chatter.MessageBrokers.SqlServiceBroker/Chatter.MessageBrokers.SqlServiceBroker.csproj' -c Release --no-build -o publish/nuget
      - name: Upload NuGet
        uses: actions/upload-artifact@v6
        with:
          name: nuget-sqlservicebroker
          path: publish/nuget/**
          retention-days: 5
          if-no-files-found: error

  version-check:
    name: version-check
    uses: ./.github/workflows/version-check.yml
    if: github.event_name == 'pull_request'
    with:
      src-path: 'src/Chatter.MessageBrokers.SqlServiceBroker/'
      csproj-path: 'src/Chatter.MessageBrokers.SqlServiceBroker/src/Chatter.MessageBrokers.SqlServiceBroker/Chatter.MessageBrokers.SqlServiceBroker.csproj'
      tag-prefix: 'sqlservicebroker'

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: Production
    env:
      NUGET_AUTH_TOKEN: ${{ secrets.NUGET_AUTH_TOKEN }}
      NUGET_URL: ${{ vars.NUGET_URL }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Guard against duplicate release
        shell: bash
        run: |
          VERSION=$(grep -m1 '<Version>' 'src/Chatter.MessageBrokers.SqlServiceBroker/src/Chatter.MessageBrokers.SqlServiceBroker/Chatter.MessageBrokers.SqlServiceBroker.csproj' | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/' | tr -d ' \r')
          TAG='sqlservicebroker/v'"${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "ERROR: Tag $TAG already exists — version was not bumped. Refusing to deploy (would silently discard merged code)." >&2
            exit 1
          fi
          echo "Release guard passed: $TAG does not yet exist."
      - name: Download NuGet
        uses: actions/download-artifact@v6
        with:
          name: nuget-sqlservicebroker
          path: ./dist/nuget
      - name: Push NuGet packages
        shell: bash
        run: |
          dotnet nuget push "./dist/nuget/*.nupkg" \
            -k '${{ env.NUGET_AUTH_TOKEN }}' \
            -s '${{ env.NUGET_URL }}' \
            --skip-duplicate

  tag:
    name: tag
    uses: ./.github/workflows/create-version-tag.yml
    needs: deploy
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    with:
      csproj-path: 'src/Chatter.MessageBrokers.SqlServiceBroker/src/Chatter.MessageBrokers.SqlServiceBroker/Chatter.MessageBrokers.SqlServiceBroker.csproj'
      tag-prefix: 'sqlservicebroker'
      package-name: 'Chatter.MessageBrokers.SqlServiceBroker'
