name: Chatter.MessageBrokers.SqlServiceBroker CD

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'The reason for running the workflow'
        required: true
        default: 'Manual build from GitHub UI'
  push:
    branches: [master]
    paths:
      - 'src/Chatter.MessageBrokers.SqlServiceBroker/src/**'
      - '.github/workflows/sqlservicebroker-cicd.yml'
      # Directory.Build.props carries the shared packaging configuration, so a change to it alters package output and must republish. The module's own packed README lives under the src/** filter above.
      - 'Directory.Build.props'

permissions:
  contents: read

concurrency:
  group: release-sqlservicebroker
  cancel-in-progress: false

jobs:
  # Packaging deliberately has no `environment:` and no `id-token:`. This job builds and runs
  # the module's tests, so its test-only dependency graph must never execute inside the envelope
  # that mints the NuGet publish credential; and every production-* environment carries a
  # required-reviewers rule, so attaching one here would demand a human approval before the tests
  # had even run.
  package:
    name: package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
    outputs:
      should_publish: ${{ steps.release_guard.outputs.should_publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
      - name: Guard against duplicate release
        # Skips the publish rather than failing the job when the tag already exists. This workflow
        # also triggers on shared packaging configuration, which legitimately reaches here with no
        # version bump; republishing an already-released version is not the intent, so skipping is
        # the accurate outcome. version-check.yml still fails a source change that forgot its bump.
        id: release_guard
        shell: bash
        run: |
          VERSION=$(grep -m1 '<Version>' 'src/Chatter.MessageBrokers.SqlServiceBroker/src/Chatter.MessageBrokers.SqlServiceBroker/Chatter.MessageBrokers.SqlServiceBroker.csproj' | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/' | tr -d ' \r')
          TAG='sqlservicebroker/v'"${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Version $VERSION is already released ($TAG exists). Skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_publish=true" >> "$GITHUB_OUTPUT"
          echo "Release guard passed: $TAG does not yet exist."
      - name: Restore
        run: dotnet restore 'src/Chatter.MessageBrokers.SqlServiceBroker/src/Chatter.MessageBrokers.SqlServiceBroker/Chatter.MessageBrokers.SqlServiceBroker.csproj' --locked-mode
      - name: Restore tests
        run: dotnet restore 'src/Chatter.MessageBrokers.SqlServiceBroker/tests/Chatter.MessageBrokers.SqlServiceBroker.Tests.csproj' --locked-mode
      - name: Build tests
        run: dotnet build 'src/Chatter.MessageBrokers.SqlServiceBroker/tests/Chatter.MessageBrokers.SqlServiceBroker.Tests.csproj' -c Release --no-restore
      - name: Test
        run: dotnet test 'src/Chatter.MessageBrokers.SqlServiceBroker/tests/Chatter.MessageBrokers.SqlServiceBroker.Tests.csproj' -c Release --no-build --filter 'Category!=Integration'
      - name: Pack
        if: steps.release_guard.outputs.should_publish == 'true'
        # ContinuousIntegrationBuild=true is set only in this CD pack step, not in Directory.Build.props:
        # enabling it repo-wide breaks local debugger source path resolution.
        run: dotnet pack 'src/Chatter.MessageBrokers.SqlServiceBroker/src/Chatter.MessageBrokers.SqlServiceBroker/Chatter.MessageBrokers.SqlServiceBroker.csproj' -c Release -o ./dist/nuget -p:ContinuousIntegrationBuild=true
      - name: Assert package provenance
        if: steps.release_guard.outputs.should_publish == 'true'
        # Asserted here on the publish path, not PR-time only: the Supply Chain Gates
        # workflow triggers on this same push with no dependency on this job, so it would
        # race the irreversible `dotnet nuget push` below instead of gating it.
        run: bash .github/scripts/assert-nupkg-provenance.sh ./dist/nuget 'src/Chatter.MessageBrokers.SqlServiceBroker/src/Chatter.MessageBrokers.SqlServiceBroker/Chatter.MessageBrokers.SqlServiceBroker.csproj'
      - name: Upload package artifact
        if: steps.release_guard.outputs.should_publish == 'true'
        # Uploads the directory, not a `*.nupkg` glob: Directory.Build.props sets IncludeSymbols
        # with SymbolPackageFormat=snupkg, and a glob would silently stop shipping the .snupkg.
        # retention-days is 7, not 1, so the artifact outlives an unbounded reviewer-approval wait.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg-sqlservicebroker
          path: ./dist/nuget
          if-no-files-found: error
          retention-days: 7

  # INVARIANT: this job has no `actions/checkout`, and its absence is the closure mechanism
  # rather than an oversight. It is the only job granted `id-token: write`, so with no working
  # tree there is no repo source, no test assemblies, no test-only dependency graph and no
  # `.github/scripts/*.sh` for anything to load alongside the publish credential. Do not add a
  # checkout back for any reason. The job id and name stay `deploy` because `tag` declares
  # `needs: deploy`; renaming would silently repoint it at packaging and let a tag land without
  # a push.
  # INVARIANT: the dependency-publish guard in this job's first step is inline bash rather than
  # a `.github/scripts/*.sh` for exactly that reason - with no checkout there is no script for
  # it to load. Nine byte-identical copies, one per module CD workflow, are the accepted cost of
  # keeping the checkout out; `.github/scripts/tests/deploy-dependency-guard.test.sh` buys that
  # cost back by extracting every copy and asserting they are byte-identical.
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/master' && github.event_name == 'push' && needs.package.outputs.should_publish == 'true'
    environment:
      name: production-sqlservicebroker
    env:
      NUGET_URL: ${{ vars.NUGET_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nupkg-sqlservicebroker
          path: ./dist/nuget
      - name: Assert declared Chatter dependencies are published
        shell: bash
        # Deliberately ahead of `Setup .NET` and therefore ahead of `NuGet login (OIDC)`: the guard
        # needs only curl and python3, so no publish credential is ever minted for a package
        # that would be unrestorable. See docs/adr/0019.
        run: |
          # BEGIN dependency-publish guard (docs/adr/0019)
          # Operator-tunable seams, each carrying its production default inline. Nothing in this
          # job sets them, so an untouched deploy always runs the defaults below; they exist so an
          # operator can widen the wait from a re-run, and so
          # .github/scripts/tests/deploy-dependency-guard.test.sh can collapse a ten-minute window
          # into seconds.
          PACKAGE_DIR="${PACKAGE_DIR:-./dist/nuget}"
          FLATCONTAINER_BASE_URL="${FLATCONTAINER_BASE_URL:-https://api.nuget.org/v3-flatcontainer}"
          DEPENDENCY_GUARD_TIMEOUT_SECONDS="${DEPENDENCY_GUARD_TIMEOUT_SECONDS:-600}"
          DEPENDENCY_GUARD_POLL_SECONDS="${DEPENDENCY_GUARD_POLL_SECONDS:-15}"
          # Every obligation below is decided on a node or a value read out of a parsed document,
          # so python3 is a hard requirement rather than a convenience. Absent, the guard says it
          # could not run instead of passing a package whose manifest it never read.
          command -v python3 >/dev/null 2>&1 || {
            echo "python3 is not on PATH, so the packed nuspec cannot be read; the dependency-publish guard did not run." >&2
            exit 2
          }
          shopt -s nullglob
          # `*.nupkg`, never `*nupkg`: IncludeSymbols drops the .snupkg into this same directory,
          # and the looser glob would find two packages where one was packed.
          packages=("$PACKAGE_DIR"/*.nupkg)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one .nupkg in $PACKAGE_DIR, found ${#packages[@]}." >&2
            exit 2
          fi
          # The reader below is written out by this step, not checked out and not loaded from
          # `.github/scripts/*.sh`: the `deploy` job deliberately carries no `actions/checkout`, so
          # there is no working tree for a script to come from, and that INVARIANT is untouched
          # here. The heredoc delimiter is quoted, so the shell interpolates nothing into the
          # program and every input it reads arrives as argv.
          guard_reader="$(mktemp)"
          guard_facts="$(mktemp)"
          trap 'rm -f "$guard_reader" "$guard_facts"' EXIT
          cat >"$guard_reader" <<'PY'
          """Reads the two documents this guard decides on: the packed nuspec, and one
          flat-container index response.

          Both are parsed, never scanned, and the nuspec is interpreted TOTALLY: every node the
          reader relies on is located by an exact-cardinality lookup against a FULLY-QUALIFIED name,
          and every node anywhere in the document that spells a name the reader models must occupy
          the one position modelled for it. No lookup may resolve to "the first one", none may fall
          back to "none found", and no element may be silently skipped. A document that admits more
          than one reading is refused (exit 2) rather than answered from whichever reading came
          first, so an empty dependency set is only ever emitted as the conclusion of an exhaustive
          read of a positively identified manifest.
          """
          import json
          import re
          import sys
          import xml.etree.ElementTree as ElementTree
          import zipfile

          FACTS_TERMINATOR = "end-of-guard-facts"
          # The bash side reads each record as two whitespace-separated fields, so a field carrying
          # whitespace or a control character would make that read ambiguous. Rejected here rather
          # than quoted downstream.
          UNSAFE_FIELD_CHARACTERS = re.compile(r"[\s\x00-\x1f\x7f]")
          # The six schema namespaces NuGet's ManifestSchemaUtility accepts, plus the empty one a
          # legacy manifest carrying no xmlns resolves to. `2011/10` is absent from most published
          # lists and is present here deliberately: a package keeps whichever schema was current
          # when it was packed, and a short list would refuse a manifest NuGet restores. This is the
          # ONLY place a namespace is compared against a list; the root's own namespace is what
          # every other name in the document is then matched against.
          MANIFEST_NAMESPACES = (
              "",
              "http://schemas.microsoft.com/packaging/2010/07/nuspec.xsd",
              "http://schemas.microsoft.com/packaging/2011/08/nuspec.xsd",
              "http://schemas.microsoft.com/packaging/2011/10/nuspec.xsd",
              "http://schemas.microsoft.com/packaging/2012/06/nuspec.xsd",
              "http://schemas.microsoft.com/packaging/2013/01/nuspec.xsd",
              "http://schemas.microsoft.com/packaging/2013/05/nuspec.xsd",
          )
          # Every element name the reader gives meaning to. An element spelling one of these outside
          # the position modelled for it - in a foreign namespace, or under an element the reader
          # does not model at all - would make the dependency set depend on where the reader chose
          # to look, so its presence is an anomaly rather than something to pass over.
          MODELLED_LOCAL_NAMES = frozenset(
              ("metadata", "id", "version", "dependencies", "group", "dependency"))
          CHATTER_ID_PREFIX = "chatter."


          def report_anomaly(message):
              sys.stderr.write(message + "\n")
              return 2


          def split_qualified_name(qualified_name):
              # ElementTree spells a namespaced tag `{uri}local` and an unnamespaced one `local`.
              if qualified_name.startswith("{"):
                  namespace_uri, _, local_name = qualified_name[1:].partition("}")
                  return namespace_uri, local_name
              return "", qualified_name


          def qualify(namespace_uri, local_name):
              if not namespace_uri:
                  return local_name
              return "{%s}%s" % (namespace_uri, local_name)


          def select_children(parent, namespace_uri, local_name):
              qualified_name = qualify(namespace_uri, local_name)
              return [child for child in parent if child.tag == qualified_name]


          def exactly_one(parent, namespace_uri, local_name):
              matches = select_children(parent, namespace_uri, local_name)
              if len(matches) != 1:
                  raise ValueError("it carries %d <%s> element(s) where exactly one is required, so "
                                   "which one states the fact is undecidable"
                                   % (len(matches), local_name))
              return matches[0]


          def at_most_one(parent, namespace_uri, local_name):
              matches = select_children(parent, namespace_uri, local_name)
              if len(matches) > 1:
                  raise ValueError("it carries %d <%s> elements where at most one is required, so "
                                   "which one states the fact is undecidable"
                                   % (len(matches), local_name))
              return matches[0] if matches else None


          def read_attribute(element, attribute_name):
              # An unprefixed attribute sits in no namespace, so its name is matched exactly.
              return element.attrib.get(attribute_name)


          def require_field(description, value):
              if value is None or not value.strip():
                  raise ValueError("the nuspec declares no %s" % description)
              trimmed = value.strip()
              if UNSAFE_FIELD_CHARACTERS.search(trimmed):
                  raise ValueError("the nuspec %s %r carries whitespace or a control character"
                                   % (description, trimmed))
              return trimmed


          def read_sole_nuspec_bytes(nupkg_path):
              # NuGet's PackageHelper.IsManifest is `IsRoot && IsNuspec`, and IsRoot rejects a `\`
              # separator as well as a `/` one because a zip entry name may carry either. Filtering
              # on only one of them admits an entry the restoring client would never read as the
              # manifest. `namelist()` also returns a duplicated entry name twice, and an archive
              # whose manifest is decided by whichever copy the central directory resolves to is
              # ambiguous, so cardinality is counted over the names rather than over a set of them.
              with zipfile.ZipFile(nupkg_path) as archive:
                  manifests = [name for name in archive.namelist()
                               if name.lower().endswith(".nuspec")
                               and "/" not in name and "\\" not in name]
                  if len(manifests) != 1:
                      raise ValueError("the archive holds %d root .nuspec entries and exactly one "
                                       "manifest is required" % len(manifests))
                  return archive.read(manifests[0])


          def read_document_namespace(root):
              # The document's namespace is derived from its own root rather than assumed, and every
              # name below is then matched fully-qualified against it. A namespace URI is part of an
              # element's name, not decoration on it.
              namespace_uri, local_name = split_qualified_name(root.tag)
              if local_name != "package":
                  raise ValueError("its root element is <%s>, not <package>, so it is not a package "
                                   "manifest" % local_name)
              if namespace_uri not in MANIFEST_NAMESPACES:
                  raise ValueError("its root element sits in the namespace %r, which is not a nuspec "
                                   "schema" % namespace_uri)
              return namespace_uri


          def read_dependency(element, records):
              dependency_id = require_field("dependency id", read_attribute(element, "id"))
              if len(element) != 0:
                  raise ValueError("its <dependency> for %s carries child elements, which no nuspec "
                                   "schema models" % dependency_id)
              if not dependency_id.lower().startswith(CHATTER_ID_PREFIX):
                  return
              declared_version = read_attribute(element, "version")
              if declared_version is None or not declared_version.strip():
                  raise ValueError("it declares %s with no version, so whether that sibling is "
                                   "published cannot be determined" % dependency_id)
              records.add((dependency_id,
                           require_field("version of %s" % dependency_id, declared_version)))


          def read_dependency_group(group, namespace_uri, records, modelled):
              for child in group:
                  modelled.add(id(child))
                  if child.tag != qualify(namespace_uri, "dependency"):
                      raise ValueError("its <group> carries <%s>, which is not a <dependency> in "
                                       "this document's namespace" % child.tag)
                  read_dependency(child, records)


          def collect_chatter_dependencies(metadata, namespace_uri, modelled):
              # <dependencies> holds either <group> elements - the form `dotnet pack` emits for a
              # multi-targeted package - or bare <dependency> elements, the flat form a
              # single-targeted one emits. Both are read, and every child is visited: an unmodelled
              # construct under here is an anomaly, never something to continue past.
              records = set()
              dependencies = at_most_one(metadata, namespace_uri, "dependencies")
              if dependencies is None:
                  return records
              modelled.add(id(dependencies))
              for child in dependencies:
                  modelled.add(id(child))
                  if child.tag == qualify(namespace_uri, "dependency"):
                      read_dependency(child, records)
                  elif child.tag == qualify(namespace_uri, "group"):
                      read_dependency_group(child, namespace_uri, records, modelled)
                  else:
                      raise ValueError("its <dependencies> carries <%s>, which is neither a <group> "
                                       "nor a <dependency> in this document's namespace" % child.tag)
              return records


          def assert_declarations_are_all_modelled(root, modelled):
              # The census that turns "I looked where I know to look and found nothing" into an
              # anomaly: a node spelling a modelled name anywhere the reader did not visit - under
              # <dependencyGroups>, or in a namespace the root did not declare - means the document
              # states its dependencies somewhere this reader does not read.
              for element in root.iter():
                  if id(element) in modelled:
                      continue
                  _, local_name = split_qualified_name(element.tag)
                  if local_name in MODELLED_LOCAL_NAMES:
                      raise ValueError("it spells <%s> at a position no nuspec schema models, so "
                                       "where it declares its dependencies is ambiguous"
                                       % element.tag)


          def emit_nuspec_facts(nupkg_path):
              try:
                  nuspec_bytes = read_sole_nuspec_bytes(nupkg_path)
              except (OSError, ValueError, zipfile.BadZipFile) as error:
                  return report_anomaly("%s is not a readable package: %s" % (nupkg_path, error))
              try:
                  # Parsed from BYTES, never from a decoded str: every nuspec `dotnet pack` writes
                  # opens with a UTF-8 BOM, which the parser consumes and a str decode would leave
                  # sitting in front of the XML declaration. ElementTree also drops comments, so a
                  # commented-out <id> is not document content and can never be read as the identity.
                  root = ElementTree.fromstring(nuspec_bytes)
              except ElementTree.ParseError as error:
                  return report_anomaly("the nuspec packed in %s is not well-formed XML: %s"
                                        % (nupkg_path, error))
              modelled = set([id(root)])
              try:
                  namespace_uri = read_document_namespace(root)
                  metadata = exactly_one(root, namespace_uri, "metadata")
                  modelled.add(id(metadata))
                  id_element = exactly_one(metadata, namespace_uri, "id")
                  version_element = exactly_one(metadata, namespace_uri, "version")
                  modelled.add(id(id_element))
                  modelled.add(id(version_element))
                  package_id = require_field("id", id_element.text)
                  package_version = require_field("version", version_element.text)
                  dependencies = collect_chatter_dependencies(metadata, namespace_uri, modelled)
                  assert_declarations_are_all_modelled(root, modelled)
              except ValueError as error:
                  return report_anomaly("the nuspec packed in %s cannot be trusted: %s"
                                        % (nupkg_path, error))
              # The manifest identity is emitted FIRST and the bash side accepts no other fact ahead
              # of it, so a dependency set - an empty one above all - can never be read off output
              # that never positively identified a manifest.
              #
              # Sorted and deduped: a multi-targeted package repeats one dependency per target
              # framework group, and the feed must be queried once for it, not once per group.
              lines = ["manifest %s %s" % (package_id, package_version)]
              for dependency_id, dependency_version in sorted(dependencies):
                  lines.append("dependency %s %s" % (dependency_id, dependency_version))
              lines.append("dependency-count %d" % len(dependencies))
              lines.append(FACTS_TERMINATOR)
              sys.stdout.write("\n".join(lines) + "\n")
              return 0


          def normalize_version(value):
              # The one spelling divergence the toolchain can deliver between a packed nuspec and a
              # flat-container index is prerelease-label CASE: `dotnet pack` copies a label through
              # verbatim while the index is always lowercase. Folded here so BOTH sides of the
              # membership test below pass through it, and over the whole string rather than the
              # label alone - numeric parts have no case, so lowering them is identity, and
              # splitting on `-` to reach the label would be hand-parsing a version this guard
              # otherwise never parses. Case-folding an identifier is already the rule on either
              # side of this reader: the `chatter.` prefix test above lowers a dependency id, and
              # the bash side lowers that same id to build the flat-container path.
              return value.strip().lower()


          def check_index_membership(index_body_path, wanted_version):
              try:
                  with open(index_body_path, "rb") as handle:
                      document = json.loads(handle.read().decode("utf-8"))
              except (OSError, UnicodeDecodeError, ValueError) as error:
                  return report_anomaly("the flat-container answered 200 with something that is not "
                                        "a JSON document: %s" % error)
              if not isinstance(document, dict) or "versions" not in document:
                  return report_anomaly("the flat-container answered 200 with a JSON document "
                                        "carrying no \"versions\" key, so it is not an index")
              published_versions = document["versions"]
              if (not isinstance(published_versions, list)
                      or any(not isinstance(entry, str) for entry in published_versions)):
                  return report_anomaly("the flat-container index's \"versions\" is not a list of "
                                        "version strings")
              # INVARIANT: normalized only AFTER the list-of-strings check above. Normalizing
              # first would raise AttributeError on a non-string entry and leave through exit 1,
              # reclassifying a document this guard could not read as a version it read as absent.
              normalized_versions = [normalize_version(entry) for entry in published_versions]
              # Published means membership of that one list. The same characters appearing anywhere
              # else in the document - a note, a "cancelled" list, an object key - mean nothing.
              return 0 if normalize_version(wanted_version) in normalized_versions else 1


          def main(argv):
              if len(argv) == 3 and argv[1] == "nuspec":
                  return emit_nuspec_facts(argv[2])
              if len(argv) == 4 and argv[1] == "index":
                  return check_index_membership(argv[2], argv[3])
              return report_anomaly("usage: nuspec <nupkg-path> | index <body-path> <version>")


          if __name__ == "__main__":
              sys.exit(main(sys.argv))
          PY
          # The packed nuspec is the only honest source of the shipped dependency set, because it
          # is the document the restoring client reads. A csproj scan or a hand-maintained list can
          # disagree with the artifact that is about to be pushed.
          if ! python3 "$guard_reader" nuspec "${packages[0]}" >"$guard_facts"; then
            echo "The packed nuspec could not be read as a document, so the declared dependency set is unknown." >&2
            exit 2
          fi
          package_id=''
          package_version=''
          declared_dependency_count=''
          dependency_records=()
          while read -r fact_kind fact_subject fact_value; do
            # INVARIANT: the manifest identity is the first fact and nothing is accepted ahead of it.
            # A dependency set - an empty one above all - read from output that never positively
            # identified a manifest is a reading of an unidentified document, which is exactly the
            # class this guard refuses rather than answers.
            if [ -z "$package_id" ] && [ "$fact_kind" != 'manifest' ]; then
              echo "The nuspec reader emitted '$fact_kind' before identifying a manifest; the declared dependency set is unknown." >&2
              exit 2
            fi
            case "$fact_kind" in
              manifest)
                if [ -n "$package_id" ]; then
                  echo "The nuspec reader identified more than one manifest; the declared dependency set is unknown." >&2
                  exit 2
                fi
                package_id="$fact_subject"
                package_version="$fact_value"
                ;;
              dependency)
                dependency_records+=("$fact_subject $fact_value")
                ;;
              dependency-count)
                declared_dependency_count="$fact_subject"
                ;;
              end-of-guard-facts)
                ;;
              *)
                echo "The nuspec reader emitted an unrecognised fact '$fact_kind'; the declared dependency set is unknown." >&2
                exit 2
                ;;
            esac
          done <"$guard_facts"
          # Positively terminated, and counted. The reader's own sentinel must be the last line and
          # the count it declared must equal the number of records read, so output truncated by a
          # reader that died mid-write cannot be mistaken for "this package declares nothing".
          if [ "$(tail -n1 "$guard_facts")" != 'end-of-guard-facts' ]; then
            echo "The nuspec reader's output is not terminated, so the declared dependency set is unknown." >&2
            exit 2
          fi
          if [ -z "$package_id" ] || [ -z "$package_version" ]; then
            echo "The nuspec reader reported no package identity, so there is nothing to verify against." >&2
            exit 2
          fi
          if [ -z "$declared_dependency_count" ] || [ "${#dependency_records[@]}" -ne "$declared_dependency_count" ]; then
            echo "The nuspec reader declared $declared_dependency_count dependency record(s) but emitted ${#dependency_records[@]}." >&2
            exit 2
          fi
          if [ "${#dependency_records[@]}" -eq 0 ]; then
            echo "$package_id $package_version declares no Chatter dependencies to verify."
            exit 0
          fi
          echo "$package_id $package_version declares ${#dependency_records[@]} Chatter dependencies to verify."
          print_recovery_guidance() {
            echo "Publishing anyway ships a package no consumer can restore, and nuget.org allows no deletion." >&2
            echo "Recovery: approve and complete the dependency's own production-* deployment, then re-run the failed jobs here." >&2
            echo "The packed artifact is retained for 7 days, so a re-run inside that window pushes the same bytes." >&2
          }
          # INVARIANT: one deadline for the whole step, computed here and never reset per sibling.
          # The budget is a TOTAL across siblings, not one budget each; a per-sibling deadline
          # would multiply a ten-minute wait by the number of declared siblings. The guard is also
          # deliberately fail-fast: the first sibling resolving to anything other than `present`
          # exits inside the case below, so a later sibling is never reached. Blocking the publish
          # takes one unpublished sibling, not all of them.
          deadline=$(( $(date +%s) + DEPENDENCY_GUARD_TIMEOUT_SECONDS ))
          for dependency_record in "${dependency_records[@]}"; do
            dependency_id="${dependency_record%% *}"
            dependency_version="${dependency_record##* }"
            # Flat-container paths are lowercased; a mixed-case id 404s against a published package.
            # The declared version is case-folded too, but inside the reader - see
            # normalize_version, the only place both sides of that comparison exist.
            lowered_id="$(tr '[:upper:]' '[:lower:]' <<<"$dependency_id")"
            index_url="$FLATCONTAINER_BASE_URL/$lowered_id/index.json"
            outcome=''
            http_status=''
            while : ; do
              index_body="$(mktemp)"
              http_status="$(curl -sSL --max-time 30 -o "$index_body" -w '%{http_code}' "$index_url" 2>/dev/null)" || http_status='000'
              if [ "$http_status" = '200' ]; then
                # Decided on membership of the parsed "versions" list, never on a text search over
                # the response bytes: a 200 is a CDN response, and the version characters can occur
                # anywhere in one without that version being published.
                # INVARIANT: both sides of that membership test pass through one normalizer, so
                # neither string is compared as it arrived. Case is the only divergence the
                # toolchain can deliver: `dotnet pack` and the flat-container index already agree
                # on every numeric spelling - leading zeros, a trailing-zero fourth part and build
                # metadata are all stripped before either string exists - while a prerelease label
                # keeps its case through `dotnet pack` and loses it in the index.
                index_status=0
                python3 "$guard_reader" index "$index_body" "$dependency_version" || index_status=$?
                if [ "$index_status" -eq 0 ]; then
                  outcome='present'
                  rm -f "$index_body"
                  break
                elif [ "$index_status" -eq 1 ]; then
                  outcome='absent'
                else
                  outcome='unreachable'
                fi
              elif [ "$http_status" = '404' ]; then
                outcome='never-published'
              else
                outcome='unreachable'
              fi
              rm -f "$index_body"
              # CDN indexing lags a push by seconds to minutes, so a miss is re-polled up to the
              # deadline rather than failing on the first look.
              [ "$(date +%s)" -lt "$deadline" ] || break
              sleep "$DEPENDENCY_GUARD_POLL_SECONDS"
            done
            case "$outcome" in
              present)
                echo "$dependency_id $dependency_version is published; $package_id $package_version may reference it."
                ;;
              absent)
                echo "$package_id $package_version declares $dependency_id $dependency_version, which is not present at $index_url after ${DEPENDENCY_GUARD_TIMEOUT_SECONDS}s." >&2
                print_recovery_guidance
                exit 1
                ;;
              never-published)
                echo "$package_id $package_version declares $dependency_id $dependency_version, but $index_url returned 404, so that id has never been published under any version." >&2
                print_recovery_guidance
                exit 1
                ;;
              *)
                echo "Could not read a flat-container index from $index_url after ${DEPENDENCY_GUARD_TIMEOUT_SECONDS}s (last HTTP status $http_status); whether $dependency_id $dependency_version is published is unknown." >&2
                exit 2
                ;;
            esac
          done
          # END dependency-publish guard (docs/adr/0019)
      - name: Setup .NET
        # No `cache:`/`cache-dependency-path:` here: the lock-file glob those options resolve
        # needs a working tree, and this job deliberately has none.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push NuGet packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./dist/nuget/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            -s '${{ env.NUGET_URL }}' \
            --skip-duplicate

  tag:
    name: tag
    uses: ./.github/workflows/create-version-tag.yml
    needs: deploy
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    with:
      csproj-path: 'src/Chatter.MessageBrokers.SqlServiceBroker/src/Chatter.MessageBrokers.SqlServiceBroker/Chatter.MessageBrokers.SqlServiceBroker.csproj'
      tag-prefix: 'sqlservicebroker'
      package-name: 'Chatter.MessageBrokers.SqlServiceBroker'
