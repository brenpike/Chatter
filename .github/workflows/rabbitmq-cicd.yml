name: Chatter.MessageBrokers.RabbitMQ CD

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'The reason for running the workflow'
        required: true
        default: 'Manual build from GitHub UI'
  push:
    branches: [master]
    paths:
      - 'src/Chatter.MessageBrokers.RabbitMQ/src/**'
      - '.github/workflows/rabbitmq-cicd.yml'
      # Directory.Build.props (provenance PropertyGroup) and README.md (packed via PackageReadmeFile) are package content; a change to either must republish.
      - 'Directory.Build.props'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: release-rabbitmq
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: production-rabbitmq
    env:
      NUGET_URL: ${{ vars.NUGET_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
      - name: Guard against duplicate release
        shell: bash
        run: |
          VERSION=$(grep -m1 '<Version>' 'src/Chatter.MessageBrokers.RabbitMQ/src/Chatter.MessageBrokers.RabbitMQ/Chatter.MessageBrokers.RabbitMQ.csproj' | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/' | tr -d ' \r')
          TAG='rabbitmq/v'"${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "ERROR: Tag $TAG already exists — version was not bumped. Refusing to deploy (would silently discard merged code)." >&2
            exit 1
          fi
          echo "Release guard passed: $TAG does not yet exist."

          # Cross-module publish-order guard. `dotnet pack` turns each direct ProjectReference
          # into a NuGet dependency pinned at that sibling's current <Version>, so shipping before
          # that exact sibling version exists on the feed would break consumer restore. Entries are
          # '<package id>:<csproj path>', one per DIRECT ProjectReference of the packed project.
          SIBLINGS=(
            'Chatter.MessageBrokers:src/Chatter.MessageBrokers/src/Chatter.MessageBrokers/Chatter.MessageBrokers.csproj'
          )

          read_project_version() {
            grep -m1 '<Version>' "$1" | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/' | tr -d ' \r'
          }

          # INVARIANT: mirrors NuGet's version normalization (lowercase, build metadata dropped,
          # leading zeros stripped, zero fourth part omitted) so a csproj version string can be
          # compared literally against the flat-container listing.
          normalize_version() {
            local raw="${1%%+*}"
            local core="${raw%%-*}"
            local prerelease=""
            if [ "$core" != "$raw" ]; then
              prerelease="-${raw#*-}"
            fi
            local major minor patch revision
            IFS='.' read -r major minor patch revision <<<"$core"
            major=$(( 10#${major:-0} ))
            minor=$(( 10#${minor:-0} ))
            patch=$(( 10#${patch:-0} ))
            revision=$(( 10#${revision:-0} ))
            if [ "$revision" -ne 0 ]; then
              core="${major}.${minor}.${patch}.${revision}"
            else
              core="${major}.${minor}.${patch}"
            fi
            printf '%s%s' "$core" "$prerelease" | tr '[:upper:]' '[:lower:]'
          }

          resolve_flat_container() {
            local index base
            if ! index=$(curl -sSfL --max-time 30 --retry 3 --retry-delay 5 "$NUGET_URL"); then
              echo "ERROR: could not read the NuGet service index at $NUGET_URL. Refusing to deploy (cannot prove dependencies are published)." >&2
              return 1
            fi
            if ! base=$(printf '%s' "$index" | jq -er '[.resources[]? | select(."@type" == "PackageBaseAddress/3.0.0") | ."@id"] | first'); then
              echo "ERROR: the NuGet service index at $NUGET_URL is unreadable or exposes no PackageBaseAddress/3.0.0 resource. Refusing to deploy (cannot prove dependencies are published)." >&2
              return 1
            fi
            printf '%s' "${base%/}"
          }

          # 0 = version is listed, 1 = feed answered but the version is absent, 2 = feed unusable.
          probe_published() {
            local base="$1" package_id="$2" wanted="$3"
            local id_lower response status body listed
            id_lower=$(printf '%s' "$package_id" | tr '[:upper:]' '[:lower:]')
            response=$(curl -sSL --max-time 30 -w '\n%{http_code}' "${base}/${id_lower}/index.json") || return 2
            status="${response##*$'\n'}"
            body="${response%$'\n'*}"
            case "$status" in
              200) ;;
              404) return 1 ;;
              *) echo "Publish-order guard: HTTP $status from ${base}/${id_lower}/index.json" >&2; return 2 ;;
            esac
            listed=$(printf '%s' "$body" | jq -r '(.versions // [])[] | ascii_downcase') || return 2
            printf '%s\n' "$listed" | grep -Fxq "$wanted"
          }

          if [ "${#SIBLINGS[@]}" -eq 0 ]; then
            echo "Publish-order guard: this package has no direct ProjectReference — nothing to assert."
            exit 0
          fi

          FLAT_CONTAINER=$(resolve_flat_container) || exit 1
          DEADLINE=$(( SECONDS + 600 ))
          for SIBLING in "${SIBLINGS[@]}"; do
            SIBLING_ID="${SIBLING%%:*}"
            SIBLING_CSPROJ="${SIBLING#*:}"
            SIBLING_VERSION=$(read_project_version "$SIBLING_CSPROJ")
            if [ -z "$SIBLING_VERSION" ]; then
              echo "ERROR: could not read <Version> from $SIBLING_CSPROJ. Refusing to deploy (cannot prove dependencies are published)." >&2
              exit 1
            fi
            SIBLING_VERSION=$(normalize_version "$SIBLING_VERSION")
            echo "Publish-order guard: waiting up to 10 minutes for $SIBLING_ID $SIBLING_VERSION on the feed (a concurrent module deploy may still be publishing it)."
            while true; do
              PROBE_STATUS=0
              probe_published "$FLAT_CONTAINER" "$SIBLING_ID" "$SIBLING_VERSION" || PROBE_STATUS=$?
              if [ "$PROBE_STATUS" -eq 0 ]; then
                echo "Publish-order guard passed: $SIBLING_ID $SIBLING_VERSION is published."
                break
              fi
              if [ "$SECONDS" -ge "$DEADLINE" ]; then
                if [ "$PROBE_STATUS" -eq 2 ]; then
                  echo "ERROR: could not confirm $SIBLING_ID $SIBLING_VERSION is published — the feed at $NUGET_URL stayed unreachable or unreadable for 10 minutes. Refusing to deploy (this package would declare an unverified dependency)." >&2
                else
                  echo "ERROR: $SIBLING_ID $SIBLING_VERSION is not published on $NUGET_URL after waiting 10 minutes. Refusing to deploy (this package would ship declaring a dependency version that does not exist)." >&2
                fi
                exit 1
              fi
              sleep 15
            done
          done
      - name: Restore
        run: dotnet restore 'src/Chatter.MessageBrokers.RabbitMQ/src/Chatter.MessageBrokers.RabbitMQ/Chatter.MessageBrokers.RabbitMQ.csproj' --locked-mode
      - name: Restore tests
        run: dotnet restore 'src/Chatter.MessageBrokers.RabbitMQ/tests/Chatter.MessageBrokers.RabbitMQ.Tests.csproj' --locked-mode
      - name: Build tests
        run: dotnet build 'src/Chatter.MessageBrokers.RabbitMQ/tests/Chatter.MessageBrokers.RabbitMQ.Tests.csproj' -c Release --no-restore
      - name: Test
        run: dotnet test 'src/Chatter.MessageBrokers.RabbitMQ/tests/Chatter.MessageBrokers.RabbitMQ.Tests.csproj' -c Release --no-build --filter 'Category!=Integration'
      - name: Pack
        # ContinuousIntegrationBuild=true is set only in this CD pack step, not in Directory.Build.props:
        # enabling it repo-wide breaks local debugger source path resolution.
        run: dotnet pack 'src/Chatter.MessageBrokers.RabbitMQ/src/Chatter.MessageBrokers.RabbitMQ/Chatter.MessageBrokers.RabbitMQ.csproj' -c Release -o ./dist/nuget -p:ContinuousIntegrationBuild=true
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push NuGet packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./dist/nuget/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            -s '${{ env.NUGET_URL }}' \
            --skip-duplicate

  tag:
    name: tag
    uses: ./.github/workflows/create-version-tag.yml
    needs: deploy
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    with:
      csproj-path: 'src/Chatter.MessageBrokers.RabbitMQ/src/Chatter.MessageBrokers.RabbitMQ/Chatter.MessageBrokers.RabbitMQ.csproj'
      tag-prefix: 'rabbitmq'
      package-name: 'Chatter.MessageBrokers.RabbitMQ'
