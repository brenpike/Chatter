name: Chatter.MessageBrokers.Reliability.EntityFramework CD

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'The reason for running the workflow'
        required: true
        default: 'Manual build from GitHub UI'
  push:
    branches: [master]
    paths:
      - 'src/Chatter.MessageBrokers.Reliability.EntityFramework/src/**'
      - '.github/workflows/reliability-ef-cicd.yml'
      # Directory.Build.props carries the shared packaging configuration, so a change to it alters package output and must republish. The module's own packed README lives under the src/** filter above.
      - 'Directory.Build.props'

permissions:
  contents: read

concurrency:
  group: release-reliability-ef
  cancel-in-progress: false

jobs:
  # Packaging deliberately has no `environment:` and no `id-token:`. This job builds and runs
  # the module's tests, so its test-only dependency graph must never execute inside the envelope
  # that mints the NuGet publish credential; and every production-* environment carries a
  # required-reviewers rule, so attaching one here would demand a human approval before the tests
  # had even run.
  package:
    name: package
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          cache: true
          cache-dependency-path: |
            **/packages.lock.json
      - name: Guard against duplicate release
        shell: bash
        run: |
          VERSION=$(grep -m1 '<Version>' 'src/Chatter.MessageBrokers.Reliability.EntityFramework/src/Chatter.MessageBrokers.Reliability.EntityFramework/Chatter.MessageBrokers.Reliability.EntityFramework.csproj' | sed 's/.*<Version>\(.*\)<\/Version>.*/\1/' | tr -d ' \r')
          TAG='reliability-ef/v'"${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "ERROR: Tag $TAG already exists — version was not bumped. Refusing to deploy (would silently discard merged code)." >&2
            exit 1
          fi
          echo "Release guard passed: $TAG does not yet exist."
      - name: Restore
        run: dotnet restore 'src/Chatter.MessageBrokers.Reliability.EntityFramework/src/Chatter.MessageBrokers.Reliability.EntityFramework/Chatter.MessageBrokers.Reliability.EntityFramework.csproj' --locked-mode
      - name: Restore tests
        run: dotnet restore 'src/Chatter.MessageBrokers.Reliability.EntityFramework/tests/Chatter.MessageBrokers.Reliability.EntityFramework.Tests.csproj' --locked-mode
      - name: Build tests
        run: dotnet build 'src/Chatter.MessageBrokers.Reliability.EntityFramework/tests/Chatter.MessageBrokers.Reliability.EntityFramework.Tests.csproj' -c Release --no-restore
      - name: Test
        run: dotnet test 'src/Chatter.MessageBrokers.Reliability.EntityFramework/tests/Chatter.MessageBrokers.Reliability.EntityFramework.Tests.csproj' -c Release --no-build --filter 'Category!=Integration'
      - name: Pack
        # ContinuousIntegrationBuild=true is set only in this CD pack step, not in Directory.Build.props:
        # enabling it repo-wide breaks local debugger source path resolution.
        run: dotnet pack 'src/Chatter.MessageBrokers.Reliability.EntityFramework/src/Chatter.MessageBrokers.Reliability.EntityFramework/Chatter.MessageBrokers.Reliability.EntityFramework.csproj' -c Release -o ./dist/nuget -p:ContinuousIntegrationBuild=true
      - name: Assert package provenance
        # Asserted here on the publish path, not PR-time only: the Supply Chain Gates
        # workflow triggers on this same push with no dependency on this job, so it would
        # race the irreversible `dotnet nuget push` below instead of gating it.
        run: bash .github/scripts/assert-nupkg-provenance.sh ./dist/nuget 'src/Chatter.MessageBrokers.Reliability.EntityFramework/src/Chatter.MessageBrokers.Reliability.EntityFramework/Chatter.MessageBrokers.Reliability.EntityFramework.csproj'
      - name: Upload package artifact
        # Uploads the directory, not a `*.nupkg` glob: Directory.Build.props sets IncludeSymbols
        # with SymbolPackageFormat=snupkg, and a glob would silently stop shipping the .snupkg.
        # retention-days is 7, not 1, so the artifact outlives an unbounded reviewer-approval wait.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nupkg-reliability-ef
          path: ./dist/nuget
          if-no-files-found: error
          retention-days: 7

  # INVARIANT: this job has no `actions/checkout`, and its absence is the closure mechanism
  # rather than an oversight. It is the only job granted `id-token: write`, so with no working
  # tree there is no repo source, no test assemblies, no test-only dependency graph and no
  # `.github/scripts/*.sh` for anything to load alongside the publish credential. Do not add a
  # checkout back for any reason. The job id and name stay `deploy` because `tag` declares
  # `needs: deploy`; renaming would silently repoint it at packaging and let a tag land without
  # a push.
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: package
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: production-reliability-ef
    env:
      NUGET_URL: ${{ vars.NUGET_URL }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: nupkg-reliability-ef
          path: ./dist/nuget
      - name: Setup .NET
        # No `cache:`/`cache-dependency-path:` here: the lock-file glob those options resolve
        # needs a working tree, and this job deliberately has none.
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push NuGet packages
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./dist/nuget/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            -s '${{ env.NUGET_URL }}' \
            --skip-duplicate

  tag:
    name: tag
    uses: ./.github/workflows/create-version-tag.yml
    needs: deploy
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: write
    with:
      csproj-path: 'src/Chatter.MessageBrokers.Reliability.EntityFramework/src/Chatter.MessageBrokers.Reliability.EntityFramework/Chatter.MessageBrokers.Reliability.EntityFramework.csproj'
      tag-prefix: 'reliability-ef'
      package-name: 'Chatter.MessageBrokers.Reliability.EntityFramework'
